version: "3.8"

services:
  employee-assistant-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: employee-assistant-server
    restart: unless-stopped
    ports:
      - "4040:4040"
    environment:
      - PORT=4040
      - NODE_ENV=production
      # Environment variables can be provided in Portainer Stack Env or via .env file:
      - DATABASE_URL=${DATABASE_URL:-}
      - JWT_SECRET=${JWT_SECRET:-super-secret-employee-assistant-jwt-key-2026}
      - AGORA_APP_ID=${AGORA_APP_ID:-}
      - AGORA_APP_CERTIFICATE=${AGORA_APP_CERTIFICATE:-}
      - AGORA_CUSTOMER_ID=${AGORA_CUSTOMER_ID:-}
      - AGORA_CUSTOMER_SECRET=${AGORA_CUSTOMER_SECRET:-}
      - MURF_API_KEY=${MURF_API_KEY:-}
      - MURF_FALCON_VOICE_ID=${MURF_FALCON_VOICE_ID:-en-US-natalie}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - DEFAULT_GITHUB_REPO=${DEFAULT_GITHUB_REPO:-thecodephilic-guy/doc-assistant}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-onboarding@resend.dev}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - CLIENT_URL=${CLIENT_URL:-*}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4040/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - assistant-net

networks:
  assistant-net:
    name: assistant-net
    driver: bridge
